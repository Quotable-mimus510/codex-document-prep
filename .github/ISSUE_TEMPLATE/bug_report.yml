name: Bug report
description: Report a reproducible conversion, chunking, search, or installation problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach confidential or copyrighted source documents.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.11.9
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input type and optional converters
      description: Describe the file format and list installed converters. Use a synthetic sample if a fixture is needed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Include the exact command with sensitive paths removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and compact logs
      description: Remove document contents, credentials, personal data, and private paths.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed confidential document content, credentials, and personal information.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
