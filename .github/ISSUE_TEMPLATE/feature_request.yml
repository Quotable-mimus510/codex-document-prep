name: Feature request
description: Suggest a format, converter, retrieval, or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What document workflow is currently difficult or unsupported?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected input, output, and context safeguards.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal can remain local-first or require explicit approval for external services.
          required: true
        - label: The proposal can preserve bounded terminal and model-context output.
          required: true
